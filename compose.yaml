services:
  # Servicio web Laravel
  web:
    build: .
    container_name: webserver
    volumes:
      - ./app:/var/www/html
    ports:
      - "80:80"
    networks:
      - web_network
    depends_on:
      - db

  # Servicio PostgreSQL
  db:
    image: postgres:17
    container_name: database
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - database_data:/var/lib/postgresql/data
    networks:
      - web_network
    restart: always

  # Interfaz web para administrar PostgreSQL
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: dbeaver
    ports:
      - "8082:8978"
    volumes:
      - dbeaver_data:/opt/cloudbeaver/workspace
    networks:
      - web_network
    restart: always
    depends_on:
      - db

volumes:
  database_data:
  dbeaver_data:

networks:
  web_network:
    driver: bridge